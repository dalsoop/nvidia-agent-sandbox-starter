[project]
name = "nvidia-agent-sandbox-starter"
version = "0.2.0"
description = "Minimal tool-calling agent for NVIDIA-hosted Nemotron models, runnable inside an NVIDIA OpenShell sandbox."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: needs the openshell CLI and a running gateway (set OPENSHELL_E2E=1)",
]
