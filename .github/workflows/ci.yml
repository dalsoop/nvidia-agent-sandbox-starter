name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -v
      - name: Build the sandbox image
        run: docker build -t nvidia-agent-sandbox-starter .
      - name: Image runs as the non-root sandbox user
        run: test "$(docker run --rm nvidia-agent-sandbox-starter id -u)" = 10001
