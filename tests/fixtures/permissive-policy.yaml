# Deliberately weakened policy used only by the end-to-end mutation test.
# `python -m agent --selfcheck` must report sandboxed=false under this policy;
# if it does not, the selfcheck is not measuring anything.
version: 1

filesystem_policy:
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /opt
  read_write:
    - /sandbox
    - /tmp
    - /var/tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  example_open:
    name: example-open
    endpoints:
      - host: example.com
        port: 443
    binaries:
      - path: /usr/bin/python3.12
