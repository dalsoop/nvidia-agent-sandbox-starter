# OpenShell sandbox policy for this starter (schema: version 1).
# Reference: https://github.com/NVIDIA/OpenShell/blob/main/docs/reference/policy-schema.mdx
#
# - Filesystem: system paths read-only, only /sandbox and /tmp writable (Landlock).
# - Process: runs as the image's non-root `sandbox` user.
# - Network: no network_policies entry, so every outbound connection is denied.
#   Model calls go to https://inference.local, which OpenShell routes to the
#   configured provider without exposing the API key inside the sandbox.
version: 1

filesystem_policy:
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /opt
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox
